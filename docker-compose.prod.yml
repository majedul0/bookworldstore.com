services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: bookworld_app
    restart: always
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - storage_data:/var/www/html/storage
      - bootstrap_cache_data:/var/www/html/bootstrap/cache
      - uploads_data:/var/www/html/public/uploads
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  webserver:
    image: nginx:stable-alpine
    container_name: bookworld_webserver
    restart: always
    ports:
      # Bound to loopback only — the VPS's own nginx (port 80, public)
      # reverse-proxies bookworldstore.com to this port. This container
      # never talks to the internet directly.
      - "127.0.0.1:${APP_PORT:-8082}:80"
    volumes:
      - .:/var/www/html
      - storage_data:/var/www/html/storage
      - uploads_data:/var/www/html/public/uploads
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - app_network

  db:
    image: mariadb:10.11
    container_name: bookworld_db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      # Loopback only, for admin access via SSH tunnel — never public.
      - "127.0.0.1:${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app_network

  node:
    image: node:20-alpine
    container_name: bookworld_node
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - node_modules_data:/var/www/html/node_modules
    command: sh -c "npm install && npm run build"
    restart: "no"
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  db_data:
  vendor_data:
  node_modules_data:
  storage_data:
  bootstrap_cache_data:
  uploads_data:
