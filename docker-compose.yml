services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: bookworld_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - storage_data:/var/www/html/storage
      - bootstrap_cache_data:/var/www/html/bootstrap/cache
      - uploads_data:/var/www/html/public/uploads
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  webserver:
    image: nginx:stable-alpine
    container_name: bookworld_webserver
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
      - storage_data:/var/www/html/storage
      - uploads_data:/var/www/html/public/uploads
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - app_network

  db:
    image: mariadb:10.11
    container_name: bookworld_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-madh_db}
      MYSQL_USER: ${DB_USERNAME:-madh_db_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    ports:
      - "${DB_FORWARD_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app_network

  node:
    image: node:20-alpine
    container_name: bookworld_node
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - node_modules_data:/var/www/html/node_modules
    command: sh -c "npm install && npm run build"
    restart: "no"
    networks:
      - app_network

  mailpit:
    image: axllent/mailpit:latest
    container_name: bookworld_mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  db_data:
  vendor_data:
  node_modules_data:
  storage_data:
  bootstrap_cache_data:
  uploads_data:
